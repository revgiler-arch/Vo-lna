name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decrypt signing key
        env:
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          if [ -z "$SIGNING_KEY_PASS" ]; then
            echo "::error::Нет секрета SIGNING_KEY_PASS (Settings → Secrets and variables → Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/volna.keystore.enc -out app/volna.keystore -pass env:SIGNING_KEY_PASS
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/*.apk Volna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Volna-apk
          path: Volna.apk
      # Готовый APK в разделе Releases: прямая ссылка, без zip
      - name: Read version
        run: echo "VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Волна (последняя сборка)
          body: "versionCode: ${{ env.VERSION_CODE }}"
          files: Volna.apk
          make_latest: true
